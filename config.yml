title: Derby-Training
paginate: 5
theme: hugo-PaperMod
baseURL: https://cpt-crunch.github.io/derby-training.com/
canonifyURLs: true
ignoreFiles:
  - '\.php$'
params:
  description: 'A simple site to share roller derby exercices with the community'
  ShowReadingTime: true
  defaultTheme: auto
  ShowShareButtons: true
  assets:
    favicon: "favicon.svg"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "favicon.svg"
  profileMode:
    enabled: false
    title: derby-training
    imageUrb: 'derby-training.com'
    imageTitle: my image
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Bonjour  \U0001F44B 🛼"
    Content: Fan de roller derby ? Envie de t'entrainer ? Tu es sur le bon site, j'espère que tu trouveras des exercices à ton gout !
      Tu trouveras également un outil permettant de visualiser un track en direct. Va voir la section Jamboard. J'ai égallement créer un petit lexique histoire de m'y retrouver dans le langage technique du roller derby.

menu:
  main:
    - name: Exercices
      url: exercices/
      weight: 1
    - name: Créer mon entraînement
      url: entrainement/
      weight: 2
    - name: Lexique
      url: lexique/
      weight: 3
    - name: Regles
      url: regles/
      weight: 4
    - name: Jamboard
      url: jamboard.html
      weight: 5
taxonomies:
  category: categories
  tag: tags
  series: series

ShowToc: false

  #mediaTypes:
  #  application/x-php:
  #    suffixes:
  #      - php
  #outputFormats:
  #  PHP:
  #    mediaType: application/x-php
  #    isPlainText: true
  #   baseName: index
 
ShowShareButtons: true

enableEmoji: true
